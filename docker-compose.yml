services:
  db:
    image: postgres:16-alpine
    container_name: sushi_app_db
    environment:
      POSTGRES_DB: sushi_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sushi_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sushi_app_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sushi_app?schema=public
      JWT_SECRET: docker-demo-secret
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sushi_app_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
